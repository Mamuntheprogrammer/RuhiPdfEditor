<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="pdfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="ruhiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base Squircle -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="252" height="252" rx="54" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Document Body with Shadow -->
  <g filter="url(#dropShadow)">
    <path d="M 64 42 L 154 42 L 194 82 L 194 210 A 10 10 0 0 1 184 220 L 64 220 A 10 10 0 0 1 54 210 L 54 52 A 10 10 0 0 1 64 42 Z" fill="url(#docGrad)"/>
    <!-- Folded Corner -->
    <path d="M 154 42 L 194 82 L 160 82 A 6 6 0 0 1 154 76 Z" fill="#cbd5e1"/>
    <path d="M 154 42 L 154 76 A 6 6 0 0 0 160 82 L 194 82 Z" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- PDF Red Ribbon Badge -->
  <rect x="44" y="68" width="82" height="28" rx="5" fill="url(#pdfGrad)"/>
  <text x="85" y="87" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">RUHI</text>

  <!-- Stylized Elegant 'R' Monogram / Quill in Blue -->
  <!-- Stem of R -->
  <rect x="80" y="112" width="14" height="68" rx="6" fill="url(#ruhiGrad)"/>
  <!-- Top Bowl of R -->
  <path d="M 88 112 L 126 112 C 144 112 152 122 152 134 C 152 146 144 154 126 154 L 92 154" fill="none" stroke="url(#ruhiGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Leg of R turning into an artistic pen flourish -->
  <path d="M 116 150 L 152 180" fill="none" stroke="url(#ruhiGrad)" stroke-width="13" stroke-linecap="round"/>

  <!-- Golden Pen Nib Accent -->
  <path d="M 152 180 L 164 190 L 156 194 L 148 186 Z" fill="url(#goldGrad)"/>
  <circle cx="157" cy="188" r="1.5" fill="#ffffff"/>

  <!-- Bottom Label: PDF EDITOR -->
  <text x="124" y="208" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="11" fill="#475569" text-anchor="middle" letter-spacing="2">PDF EDITOR</text>

  <!-- Subtle sparkle on top-left -->
  <path d="M 40 36 Q 48 36 48 28 Q 48 36 56 36 Q 48 36 48 44 Q 48 36 40 36 Z" fill="url(#goldGrad)"/>
</svg>

